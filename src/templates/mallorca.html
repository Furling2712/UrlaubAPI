<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mallorca – Playa de Palma | 21.–26. Juli 2026</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f4f8; color: #1a202c; }

    header {
      background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
      color: white;
      padding: 32px 24px 28px;
      text-align: center;
    }
    header h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 6px; }
    header p  { font-size: 1rem; opacity: 0.92; }

    .badge {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.85rem;
      margin-top: 10px;
    }

    main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }

    #status {
      text-align: center;
      padding: 48px 0;
      color: #718096;
      font-size: 1rem;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: #ff6b35;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #results { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      overflow: hidden;
      transition: transform .15s, box-shadow .15s;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,.12); }

    .card-head {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 14px 16px 12px;
    }
    .card-head .hotel { font-weight: 700; font-size: 0.95rem; line-height: 1.3; }
    .card-head .stars { font-size: 0.75rem; opacity: 0.85; margin-top: 2px; }

    .card-body { padding: 14px 16px; flex: 1; }

    .info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.85rem; }
    .info-row .label { color: #718096; }
    .info-row .value { font-weight: 600; }

    .dates { font-size: 0.82rem; color: #4a5568; background: #f7fafc; border-radius: 6px; padding: 6px 10px; margin-bottom: 10px; }
    .dates span { font-weight: 600; }

    .route { font-size: 0.8rem; color: #718096; margin-bottom: 4px; }

    .price-block { margin-top: auto; padding: 12px 16px; border-top: 1px solid #e2e8f0; display: flex; align-items: baseline; gap: 8px; }
    .price-pp { font-size: 1.5rem; font-weight: 800; color: #ff6b35; }
    .price-label { font-size: 0.78rem; color: #a0aec0; }

    .meal-tag {
      display: inline-block;
      font-size: 0.72rem;
      background: #ebf8ff;
      color: #2b6cb0;
      border-radius: 4px;
      padding: 2px 7px;
      margin-left: auto;
    }

    #no-results { text-align: center; padding: 48px 0; color: #718096; }
    #count-bar { margin-bottom: 16px; font-size: 0.88rem; color: #718096; }
    #count-bar strong { color: #2d3748; }
  </style>
</head>
<body>

<header>
  <h1>✈ Mallorca – Playa de Palma</h1>
  <p>Pauschalreisen ab Köln/Bonn (CGN)</p>
  <div class="badge">21. Juli – 26. Juli 2026 &nbsp;·&nbsp; 4–5 Nächte &nbsp;·&nbsp; 1 Person</div>
</header>

<main>
  <div id="status">
    <div class="spinner"></div>
    Suche günstigste Angebote…
  </div>
  <div id="count-bar" style="display:none"></div>
  <div id="results"></div>
  <div id="no-results" style="display:none">Keine Angebote gefunden – bitte später nochmal versuchen.</div>
</main>

<script>
fetch("/mallorca-search")
  .then(r => r.json())
  .then(data => {
    document.getElementById("status").style.display = "none";
    const offers = data.offers || [];
    if (!offers.length) {
      document.getElementById("no-results").style.display = "block";
      return;
    }

    const bar = document.getElementById("count-bar");
    bar.style.display = "block";
    bar.innerHTML = `<strong>${offers.length} Angebote</strong> gefunden – sortiert nach Preis`;

    const container = document.getElementById("results");
    offers.forEach(o => {
      const stars = o.stars ? "★".repeat(Math.round(parseFloat(o.stars))) : "";
      const depFmt = o.dep_date ? o.dep_date.split("-").reverse().join(".") : "";
      const retFmt = o.ret_date ? o.ret_date.split("-").reverse().join(".") : "";

      const card = document.createElement("a");
      card.className = "card";
      card.href = o.booking_url || "#";
      card.target = "_blank";
      card.rel = "noopener";

      card.innerHTML = `
        <div class="card-head">
          <div class="hotel">${o.hotel_name || "Hotel"}</div>
          <div class="stars">${stars} ${o.city ? "· " + o.city : ""}</div>
        </div>
        <div class="card-body">
          <div class="dates">
            ${depFmt ? `<span>${depFmt}</span> – <span>${retFmt}</span>` : ""}
            &nbsp; ${o.duration} Nächte
          </div>
          <div class="route">${o.dep_airport || "CGN"} → ${o.dst_airport || "PMI"}</div>
          <div class="info-row">
            <span class="label">Verpflegung</span>
            <span class="value">${o.meal_label || "–"}</span>
          </div>
          <div class="info-row">
            <span class="label">Veranstalter</span>
            <span class="value">${o.tour_operator || "–"}</span>
          </div>
        </div>
        <div class="price-block">
          <span class="price-pp">${o.price_per_person ? o.price_per_person.toLocaleString("de-DE") + " €" : "–"}</span>
          <span class="price-label">/ Person</span>
        </div>`;

      container.appendChild(card);
    });
  })
  .catch(() => {
    document.getElementById("status").style.display = "none";
    document.getElementById("no-results").style.display = "block";
  });
</script>
</body>
</html>
